version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cv_evaluator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cv_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cv_evaluator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cv_admin} -d ${POSTGRES_DB:-cv_evaluator}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
